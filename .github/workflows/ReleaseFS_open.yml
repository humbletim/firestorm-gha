name: ReleaseFS_open

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
      vrmod_repo:
        type: string
        default: "humbletim/p373r-vrmod"
        required: true
      vrmod_branch:
        type: string
        default: "main"
        required: true
      extra_autobuild_configure:
        required: true
        type: string
        default: "--avx2"

run-name: ReleaseFS_open | ${{ inputs.vrmod_repo }}:${{ inputs.vrmod_branch }} x ${{ inputs.ref }} ${{ inputs.extra_autobuild_configure }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: Create Clean Annotation Notice
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          # Use jq to format as "Key: Value", then swap newlines (\n) with %0A for the annotation
          CLEAN_NOTICE=$(echo "$INPUTS_JSON" | jq -r 'to_entries | map("\(.key): \(.value)") | join("\n")')
          # URL-encode the newlines so the GitHub annotation parser reads it as one message
          CLEAN_NOTICE="${CLEAN_NOTICE//$'\n'/'%0A'}"
          echo "::notice file=.github/workflows/main.yml,line=1,title=Workflow Dispatch Inputs::$CLEAN_LIST"
          
      - name: Clone repos
        run: |
          set -xEuo pipefail

          # 1. Checkout Viewer (treeless clone, full history)
          git clone https://github.com/FirestormViewer/phoenix-firestorm.git --branch ${{ inputs.ref }} --filter=tree:0 --no-progress . &

          # 2. Checkout tpv-gha-nunja (shallow clone)
          git clone https://github.com/humbletim/firestorm-gha.git --depth 1 --branch tpv-gha-nunja --single-branch --no-progress ../tpv-gha-nunja &

          # 3. Checkout p373r-vrmod (shallow clone)
          git clone https://github.com/${{ inputs.vrmod_repo }}.git --depth 1 --branch ${{ inputs.vrmod_branch }} --single-branch --no-progress ../p373r-vrmod-main &

          # 4. Checkout fs-build-variables (shallow clone)
          git clone https://github.com/FirestormViewer/fs-build-variables.git --depth 1 --branch master --single-branch --no-progress ../build-variables &

          _pythonx64=`ls -1d /c/hostedtoolcache/windows/Python/3.*/x64/ | sort -h | tail -1`
          
          # -- BEGIN PYTHON PURGE --
          # 1. Nuke all other Python versions in the GHA toolcache
          _py_ver_dir=$(dirname "$_pythonx64")
          find /c/hostedtoolcache/windows/Python -mindepth 1 -maxdepth 1 -type d ! -path "$_py_ver_dir" -exec rm -rf {} + 2>/dev/null || true
          
          # 2. Nuke PyPy
          rm -rf /c/hostedtoolcache/windows/PyPy*
          
          # 3. Nuke MSYS2 / MinGW pythons 
          find /c/msys64 -type f -name "python*.exe" -delete 2>/dev/null || true
          
          # 4. Nuke Windows Store app execution aliases
          rm -f /c/Users/*/AppData/Local/Microsoft/WindowsApps/python*.exe
          # -- END PYTHON PURGE --

          (
            echo "$_pythonx64/Scripts"
            echo "$_pythonx64"
          ) | tee -a $GITHUB_PATH

          export PATH="$PATH:$_pythonx64/Scripts:$_pythonx64"
          echo "AUTOBUILD_VARIABLES_FILE=$PWD/../build-variables/variables" >> $GITHUB_ENV
          echo "AUTOBUILD_VSVER=170" >> $GITHUB_ENV
          echo "AUTOBUILD_LOGLEVEL=--verbose" >> $GITHUB_ENV

          wait
          ln -s ../tpv-gha-nunja/gha-node20-run

      - name: Eradicate all non-3.15.1 Pythons
        shell: pwsh
        run: |
          # 1. Purge all other Python versions in the hosted tool cache
          Get-ChildItem 'C:\hostedtoolcache\windows\Python' -Directory | Where-Object Name -ne '3.15.1' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          # 2. Purge PyPy cache
          Remove-Item 'C:\hostedtoolcache\windows\PyPy*' -Recurse -Force -ErrorAction SilentlyContinue
          
          # 3. Nuke Windows Store App execution aliases (prevents rogue 'python' calls from opening the Store)
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue
          
          # 4. Nuke MSYS2 Python executables
          Get-ChildItem -Path 'C:\msys64' -Recurse -Filter 'python.exe' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          
          # 5. Scrub the PATH of any Python/PyPy/MSYS64 references (except the 3.15.1 path) for future steps
          $SafePaths = @('C:\hostedtoolcache\windows\Python\3.15.1\x64', 'C:\hostedtoolcache\windows\Python\3.15.1\x64\Scripts')
          $CleanPathArray = ($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)Python(?!\\3\.15\.1)|PyPy|msys64' }
          
          # Rebuild PATH, forcefully prepending our 3.15.1 installation
          $NewPath = ($SafePaths + $CleanPathArray) -join ';'
          
          # Apply path update to the current Machine environment and the GitHub Action context
          [Environment]::SetEnvironmentVariable('PATH', $NewPath, 'Machine')
          echo "C:\hostedtoolcache\windows\Python\3.15.1\x64" >> $env:GITHUB_PATH
          echo "C:\hostedtoolcache\windows\Python\3.15.1\x64\Scripts" >> $env:GITHUB_PATH
    
      - name: Pip Choco
        run: |
          set -xEuo pipefail
          pip install -r requirements.txt &
          choco install nsis --no-progress &
          wait

      - name: Preflight Check
        uses: ./gha-node20-run
        with:
          run: |
            python -c 'print(__import__("llsd"))'

      - name: Preflight Check 2
        run: |
            python -c 'print(__import__("llsd"))'
            python -c 'print(__import__("llbase"))'
            python viewer_manifest.py --help

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

      - name: Provision 3p-openvr_api
        run: |
          set -Euo pipefail
          source ../p373r-vrmod-main/misc/3p-openvr_api/improvise.bash
          provision_openvr_api $PWD
          autobuild installables add --archive file:///`cygpath -m $PWD/openvr_api-v*.*.*.*.tar.bz2`
          autobuild install openvr_api --verbose

      - name: Provision 3p-openjp2_api
        run: |
          set -Euo pipefail
          source ../p373r-vrmod-main/misc/3p-openjp2_api/improvise.bash
          provision_openjp2 $PWD
          autobuild installables add --archive file:///`cygpath -m $PWD/openjp2_api-v*.*.*.*.tar.bz2`
          autobuild install openjp2_api --verbose
          provision_openjpeg_dummy $PWD
          autobuild installables remove openjpeg
          autobuild installables add --archive file:///`cygpath -m $PWD/openjpeg-v*-dummy.tar.bz2`

      - name: Autobuild Configure
        run: |
          autobuild configure -A 64 -c ReleaseFS_open -- ${{ inputs.extra_autobuild_configure }} --chan VR-GHA --package -DLL_TESTS:BOOL=FALSE

      - name: Precompile Devtime
        run: |
          cmake --build build-vc170-64 --target firestorm-bin --config Release

      - name: Snapshot Devtime
        uses: ./gha-node20-run
        with:
          run: |
            set -Euo pipefail
            export ghash=$PWD/../tpv-gha-nunja/gha
            source ../tpv-gha-nunja/.github/workflows/ReleaseFS_open.yml.bash
            generate_env && generate_devtime

      - name: Provision 3p-p373r-vrmod
        run: |
          set -Euo pipefail
          source ../p373r-vrmod-main/misc/3p-p373r-vrmod/improvise.bash
          provision_p373r_vrmod $PWD
          autobuild installables add --archive file:///`cygpath -m $PWD/p373r-vrmod-v*.*.*.*.tar.bz2`
          autobuild install p373r-vrmod --verbose
          PATH=/c/Program\ Files/Git/usr/bin:$PATH patch --directory=indra/newview --ignore-whitespace --verbose --merge -p1 < ../p373r-vrmod-main/sgeo-minimal/0001-sgeo_min_vr_7.1.9-baseline-diff.patch
          git diff || true

      - name: Compile VR Mod
        run: |
          cmake --build build-vc170-64 --target firestorm-bin --config Release

      - name: Generate VR Mod Installer Setup.exe
        run: |
          # autobuild build -A 64 -c ReleaseFS_open --no-configure
          cmake --build build-vc170-64 --target llpackage --config Release

      - name: Upload Community VR Mod Installer
        uses: ./gha-node20-run
        with:
          run: |
            source ../tpv-gha-nunja/gha/gha.upload-artifact.bash
            gha-upload-artifact-fast community-firestorm-vrmod build-*/newview/Release/*Setup.exe 7

      - name: Upload VR Mod Setup.exe
        if: false
        uses: actions/upload-artifact@v4
      #   with:
      #     name: community-vrmod-firestorm
      #     path: build-*/newview/Release/*Setup.exe

      - name: Setup upterm session
        # if: always()
        if: failure()
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
