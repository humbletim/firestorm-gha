name: p373r-vrmod

on:
  workflow_dispatch:
    inputs:
      artifact:
        type: string
        required: true
      fstuple:
        type: string
        default: '{"pause":"never"}'

run-name: p373r-vrmod | ${{ inputs.artifact }}

defaults:
  run:
    shell: bash

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
    - uses: humbletim/firestorm-gha/.github/vrmod@tpv-gha-nunja
      with:
        key: ${{ fromJSON(inputs.fstuple).key }}
        artifact: ${{ inputs.artifact }}

    - name: preflight tests
      run: |
        test -v prefix              || exit 103
        test -v snapshot_dir        || exit 104
        test -s devtime/link.rsp    || exit 100
        test -s devtime/compile.rsp || exit 101
        test -s winsdk/winsdk.rsp   || exit 102
        (
          echo workflow=${{ github.workflow }}
          echo build_id=$(date +"%Y%m%d-%H%M%S")
        ) | tee -a $GITHUB_ENV

    - name: checkout p373r vrmod branch
      shell: bash
      run: |
        repository=humbletim/firestorm-gha
        ref=P373R_6.6.8
        path=p373r
        git clone --quiet --filter=tree:0 --single-branch https://github.com/$repository --branch "$ref" $path 2>&1 \
          | sed -E '/^(remote:|Receive|Resolve)/d'
      # uses: actions/checkout@v4
      # with:
      #   persist-credentials: false
      #   show-progress: false
      #   clean: false
      #   repository: humbletim/firestorm-gha
      #   ref: P373R_6.6.8
      #   path: p373r

